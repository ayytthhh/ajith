<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p5bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#1e2734" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p5bg)" />
  <rect x="30" y="25" width="540" height="330" rx="12" fill="#1f242d" stroke="#323946" stroke-width="2" />
  <rect x="30" y="25" width="540" height="40" rx="12" fill="#282f3c" />
  <circle cx="55" cy="45" r="5" fill="#ff5f56" />
  <circle cx="75" cy="45" r="5" fill="#ffbd2e" />
  <circle cx="95" cy="45" r="5" fill="#27c93f" />
  <text x="300" y="50" font-family="'Poppins', sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">digit-recognizer.ai</text>

  <!-- Left: Drawing canvas -->
  <rect x="60" y="85" width="220" height="235" rx="8" fill="#0d1117" stroke="#00eeff" stroke-width="2" />
  <text x="170" y="110" font-family="'Poppins', sans-serif" font-size="11" fill="#8892b0" text-anchor="middle">Draw a digit (0-9)</text>
  <!-- Handwritten number 7 -->
  <path d="M100 140 L230 140 L160 280" fill="none" stroke="#00eeff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="130" y1="210" x2="190" y2="210" stroke="#00eeff" stroke-width="12" stroke-linecap="round" />

  <!-- Right: Model Prediction -->
  <rect x="300" y="85" width="240" height="235" rx="8" fill="#181e28" stroke="#323946" stroke-width="1" />
  <text x="420" y="115" font-family="'Poppins', sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">Model Prediction</text>
  <circle cx="420" cy="180" r="45" fill="#1f242d" stroke="#00eeff" stroke-width="3" />
  <text x="420" y="198" font-family="'Poppins', sans-serif" font-size="52" font-weight="700" fill="#00eeff" text-anchor="middle">7</text>
  <text x="420" y="255" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">Confidence: 98.7%</text>
  <text x="420" y="280" font-family="'Poppins', sans-serif" font-size="10" fill="#8892b0" text-anchor="middle">MNIST CNN / Keras Model</text>
</svg>

