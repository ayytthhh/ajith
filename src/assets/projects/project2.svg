<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121820" />
      <stop offset="100%" stop-color="#1d2633" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p2bg)" />
  <!-- UI Window Header -->
  <rect x="30" y="25" width="540" height="330" rx="12" fill="#1f242d" stroke="#323946" stroke-width="2" />
  <rect x="30" y="25" width="540" height="40" rx="12" fill="#282f3c" />
  <circle cx="55" cy="45" r="5" fill="#ff5f56" />
  <circle cx="75" cy="45" r="5" fill="#ffbd2e" />
  <circle cx="95" cy="45" r="5" fill="#27c93f" />
  <text x="300" y="50" font-family="'Poppins', sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">ai-sentiment-analyzer.app</text>

  <!-- Input Box UI -->
  <rect x="60" y="85" width="480" height="60" rx="8" fill="#141923" stroke="#00eeff" stroke-width="1.5" />
  <text x="80" y="120" font-family="'Poppins', sans-serif" font-size="13" fill="#ededed">"Learning AI & Machine Learning is super thrilling!"</text>

  <!-- Sentiment Results Gauge -->
  <rect x="60" y="165" width="150" height="155" rx="8" fill="#181e28" stroke="#323946" stroke-width="1" />
  <text x="135" y="195" font-family="'Poppins', sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">Overall Mood</text>
  <circle cx="135" cy="245" r="35" fill="none" stroke="#252d3a" stroke-width="8" />
  <circle cx="135" cy="245" r="35" fill="none" stroke="#00eeff" stroke-width="8" stroke-dasharray="190" stroke-dashoffset="30" stroke-linecap="round" />
  <text x="135" y="250" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#00eeff" text-anchor="middle">94%</text>
  <text x="135" y="295" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#27c93f" text-anchor="middle">POSITIVE</text>

  <!-- Bar Breakdown -->
  <rect x="230" y="165" width="310" height="155" rx="8" fill="#181e28" stroke="#323946" stroke-width="1" />
  <text x="250" y="195" font-family="'Poppins', sans-serif" font-size="12" fill="#8892b0">Model Probabilities (Naive Bayes / NLP)</text>
  
  <text x="250" y="225" font-family="'Poppins', sans-serif" font-size="11" fill="#ededed">Joy / Optimism</text>
  <rect x="250" y="235" width="270" height="8" rx="4" fill="#282f3c" />
  <rect x="250" y="235" width="245" height="8" rx="4" fill="#00eeff" />

  <text x="250" y="265" font-family="'Poppins', sans-serif" font-size="11" fill="#ededed">Neutral</text>
  <rect x="250" y="275" width="270" height="8" rx="4" fill="#282f3c" />
  <rect x="250" y="275" width="40" height="8" rx="4" fill="#8892b0" />

  <text x="250" y="300" font-family="'Poppins', sans-serif" font-size="11" fill="#ededed">Negative</text>
  <rect x="250" y="306" width="270" height="8" rx="4" fill="#282f3c" />
  <rect x="250" y="306" width="15" height="8" rx="4" fill="#ff5f56" />
</svg>

